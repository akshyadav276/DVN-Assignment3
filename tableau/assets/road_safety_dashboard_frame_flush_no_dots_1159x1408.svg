<svg xmlns="http://www.w3.org/2000/svg" width="1159" height="1408" viewBox="0 0 1159 1408" role="img" aria-labelledby="title desc">
  <title id="title">Road safety dashboard flush frame without dots</title>
  <desc id="desc">A 1159 by 1408 Tableau dashboard frame with no gap between the canvas edge and the border, using a blue and orange top accent without decorative dots.</desc>

  <defs>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1159" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0072B2"/>
      <stop offset="0.52" stop-color="#0072B2"/>
      <stop offset="0.52" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#E69F00"/>
    </linearGradient>

    <pattern id="microGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#D9DEE3" stroke-width="1" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1159" height="1408" fill="#FAFBFC"/>
  <rect width="1159" height="1408" fill="url(#microGrid)" opacity="0.24"/>

  <rect x="0.75" y="0.75" width="1157.5" height="1406.5" rx="8" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="1157.5" height="1406.5" rx="8" fill="none" stroke="#0072B2" stroke-width="2.2" opacity="0.25"/>

  <!-- Clean top accent, no decorative dots. -->
  <rect x="0" y="0" width="1159" height="8" fill="url(#topAccent)"/>

  <!-- Light road motif retained, pushed to the far right so it does not fight the charts. -->
  <g opacity="0.42">
    <path d="M1010 64C1048 112 1083 158 1094 214C1108 282 1074 338 1028 384C984 428 940 470 927 531C913 600 948 658 1000 706C1049 752 1086 811 1078 889C1068 982 984 1028 915 1083C848 1136 814 1223 860 1328" fill="none" stroke="#E69F00" stroke-width="22" stroke-linecap="round" opacity="0.07"/>
    <path d="M1044 62C1080 111 1110 160 1117 220C1124 286 1090 345 1042 388C998 427 955 469 943 529C930 595 962 652 1014 701C1067 751 1102 815 1092 893C1080 986 1000 1035 930 1090C864 1142 832 1225 874 1328" fill="none" stroke="#0072B2" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18" opacity="0.15"/>
  </g>

  <g opacity="0.34" stroke-linecap="round">
    <path d="M30 1330H238" stroke="#0072B2" stroke-width="3"/>
    <path d="M30 1348H162" stroke="#E69F00" stroke-width="3"/>
    <path d="M30 1366H282" stroke="#A7ADB1" stroke-width="3"/>
  </g>
</svg>
