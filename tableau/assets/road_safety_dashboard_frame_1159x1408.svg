<svg xmlns="http://www.w3.org/2000/svg" width="1159" height="1408" viewBox="0 0 1159 1408" role="img" aria-labelledby="title desc">
  <title id="title">Road safety dashboard visual frame</title>
  <desc id="desc">A subtle 1159 by 1408 dashboard frame with a blue and orange road-safety accent motif for Tableau dashboards.</desc>

  <defs>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1159" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0072B2"/>
      <stop offset="0.52" stop-color="#0072B2"/>
      <stop offset="0.52" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#E69F00"/>
    </linearGradient>

    <linearGradient id="softRoad" x1="744" y1="1198" x2="1166" y2="1392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0072B2" stop-opacity="0.11"/>
      <stop offset="0.56" stop-color="#0072B2" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#E69F00" stop-opacity="0.09"/>
    </linearGradient>

    <pattern id="microGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#D9DEE3" stroke-width="1" opacity="0.24"/>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0E2433" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1159" height="1408" fill="#FAFBFC"/>
  <rect width="1159" height="1408" fill="url(#microGrid)" opacity="0.45"/>

  <rect x="24" y="24" width="1111" height="1360" rx="18" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="1111" height="8" rx="4" fill="url(#topAccent)"/>

  <g opacity="0.95">
    <circle cx="46" cy="58" r="7" fill="#0072B2"/>
    <circle cx="66" cy="58" r="7" fill="#E69F00"/>
    <circle cx="86" cy="58" r="7" fill="#A7ADB1"/>
