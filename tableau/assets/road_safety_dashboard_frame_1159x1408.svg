    <path d="M1042 44C1080 94 1111 143 1120 199C1130 261 1104 321 1058 363C1017 401 961 430 928 476C888 531 887 600 925 659C959 712 1016 746 1045 802C1080 870 1049 945 990 992C924 1046 834 1060 783 1127C734 1193 760 1286 827 1349" fill="none" stroke="#0072B2" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18" opacity="0.18"/>
